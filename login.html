<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Veterinaria La Mary</title>
    <link rel="icon" href="./assets/img/Firefly.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="estilos.css">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script defer src="./js/sesion.js"></script>
    <script defer src="./js/login.js"></script>
</head>
<body>
    <!-- navbar -->
    <header>
        <!-- navbar-expand-lg = desde 992px se muestra en línea, antes usa el menú hamburguesa -->
        <nav class="navbar navbar-expand-lg navbar-principal" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="./assets/img/logo.png" alt="Veterinaria La Mary">
                </a>
                <!-- botón hamburguesa para móvil -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <!-- esto es lo que se colapsa en móvil -->
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto gap-4">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="nosotros.html">Nosotros</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="contacto.html">Contacto</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="login.html">Iniciar sesión</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main>
        <section class="container py-5">
            <div class="row justify-content-center">
                <article class="col-12 col-md-8 col-lg-5">
                    <form class="formulario-admin d-flex flex-column gap-3" id="form-sesion">
                        <h1 class="fs-4">Iniciar sesión</h1>
                        <p class="small mb-0">Acceso para el personal de la veterinaria.</p>
                        <div>
                            <label for="nombreUsuario" class="form-label">Nombre de usuario</label>
                            <input type="text" name="nombreUsuario" id="nombreUsuario" class="form-control" autocomplete="username" required>
                        </div>
                        <div>
                            <label for="contrasenia" class="form-label">Contraseña</label>
                            <input type="password" name="contrasenia" id="contrasenia" class="form-control" autocomplete="current-password" required>
                        </div>
                        <span id="mensajeError" class="text-danger"></span>
                        <button id="botonIniciarSesion" class="btn btn-principal" type="submit">Iniciar sesión</button>
                    </form>
                </article>
            </div>
        </section>
    </main>
    <!-- footer -->
    <footer class="footer">
        <div class="container">
            <div class="row">

                <!-- 3 columnas, apiladas en celular -->
                <div class="col-12 col-md-4">
                    <h3>Veterinaria La Mary</h3>
                    <p>Cuidamos a quienes forman parte de tu familia 🐾</p>
                </div>

                <div class="col-12 col-md-4">
                    <ul class="nav footer-links">
                        <li class="nav-item"><a class="nav-link" href="https://www.facebook.com/" target="_blank"><img src="./assets/img/facebook.png" alt="Facebook"></a></li>
                        <li class="nav-item"><a class="nav-link" href="https://www.instagram.com/" target="_blank"><img src="./assets/img/instagram.png" alt="Instagram"></a></li>
                        <li class="nav-item"><a class="nav-link" href="https://www.tiktok.com/" target="_blank"><img src="./assets/img/tiktok.png" alt="Tiktok"></a></li>
                    </ul>
                </div>

                <div class="col-12 col-md-4">
                    <p>📍 Argentina</p>
                    <p>📞 +54 9 297 4040637</p>
                </div>

            </div>

            <div class="footer-copyright text-center small">
                <p>© 2026 Veterinaria La Mary. Todos los derechos reservados.</p>
            </div>
        </div>
    </footer>
</body>
</html>
